<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Alpha AI Ecosystem</title>
  <desc id="desc">Alpha Intelligence ecosystem diagram showing Workflow, Chatflow and Super Agent connected to built-in nodes, user-generated tools, marketplaces, external resources and Alpha Knowledge.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#23145f" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="purpleBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c69e8"/>
      <stop offset="1" stop-color="#9a7bea"/>
    </linearGradient>
    <linearGradient id="nodeIcon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9c45"/>
      <stop offset="1" stop-color="#ff7628"/>
    </linearGradient>
    <linearGradient id="knowledgeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f4ff"/>
      <stop offset="1" stop-color="#d5eaff"/>
    </linearGradient>
    <style>
      .title { font: 500 54px Arial, Helvetica, sans-serif; fill: #111827; }
      .label { font: 700 25px Arial, Helvetica, sans-serif; fill: #111827; }
      .small { font: 500 20px Arial, Helvetica, sans-serif; fill: #374151; }
      .tiny { font: 600 15px Arial, Helvetica, sans-serif; fill: #374151; }
      .white { fill: #fff; }
      .stroke-purple { stroke: #9a72ea; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-blue { stroke: #58a9f9; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 8 9; }
    </style>
  </defs>

